<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종현 롤링페이퍼</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: #f0f2f5; margin: 0; padding-bottom: 80px; }
        
        /* 헤더 개선: 버튼과 제목 겹침 방지 */
        header { 
            background: #fff; padding: 15px; 
            display: flex; flex-direction: column; align-items: center;
            position: sticky; top: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 100; 
        }
        .header-top { width: 100%; display: flex; justify-content: flex-end; margin-bottom: 10px; }
        .login-btn { padding: 5px 15px; border-radius: 20px; border: 1px solid #007bff; background: #fff; color: #007bff; cursor: pointer; font-weight: bold; }
        
        #papers-container { 
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; 
            padding: 15px; max-width: 600px; margin: auto; 
        }
        
        .paper-card { 
            background: #fff; padding: 15px; border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); position: relative; min-height: 100px;
        }
        .paper-card h3 { margin: 0 0 8px 0; font-size: 1rem; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .paper-card p { margin: 0; font-size: 0.85rem; color: #555; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .paper-card .time { font-size: 0.7rem; color: #bbb; margin-top: 10px; display: block; }
        
        .edit-btns { position: absolute; bottom: 10px; right: 10px; }
        .edit-btns span { cursor: pointer; margin-left: 8px; font-size: 0.9rem; }

        .fab { 
            position: fixed; bottom: 25px; right: 25px; 
            width: 60px; height: 60px; background: #007bff; 
            border-radius: 50%; color: white; border: none; 
            font-size: 30px; box-shadow: 0 4px 12px rgba(0,123,255,0.4); cursor: pointer; z-index: 99;
        }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 200; }
        .modal-content { background: white; width: 85%; max-width: 400px; margin: 80px auto; padding: 25px; border-radius: 20px; box-sizing: border-box; }
        input, textarea { width: 100%; margin-bottom: 12px; padding: 12px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        .btn-group { display: flex; gap: 10px; }
        .btn-main { flex: 2; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; }
        .btn-sub { flex: 1; padding: 12px; background: #eee; border: none; border-radius: 8px; }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <button class="login-btn" id="authBtn">로그인</button>
    </div>
    <h2 style="margin:0; font-size: 1.1rem; color: #111;">종현이에게 하고 싶은 말을 적어주세요</h2>
</header>

<div id="papers-container">
    <!-- 로딩 메시지 -->
    <p style="grid-column: span 2; text-align: center; color: #888;">메시지를 불러오는 중...</p>
</div>

<button class="fab" id="openModalBtn">+</button>

<div id="writeModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">메시지 작성</h3>
        <input type="text" id="postTitle" placeholder="제목을 입력하세요">
        <textarea id="postContent" rows="5" placeholder="내용을 입력하세요"></textarea>
        <div class="btn-group">
            <button class="btn-sub" id="closeModalBtn">취소</button>
            <button class="btn-main" id="confirmSaveBtn">확인</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBr6fn0z5WiCb8r0ho9dRM_rcJFncEZfdg",
        authDomain: "click-396e8.firebaseapp.com",
        projectId: "click-396e8",
        storageBucket: "click-396e8.firebasestorage.app",
        messagingSenderId: "985576350437",
        appId: "1:985576350437:web:ed65dbfff76cbdf5c2ea0c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let editId = null;

    // --- 데이터 불러오기 함수 (최적화: 호출 시에만 읽기) ---
    async function loadPapers() {
        const container = document.getElementById('papers-container');
        const q = query(collection(db, "papers"), orderBy("createdAt", "desc"));
        
        try {
            const querySnapshot = await getDocs(q);
            container.innerHTML = '';
            
            if (querySnapshot.empty) {
                container.innerHTML = '<p style="grid-column: span 2; text-align: center; color: #888;">첫 번째 메시지를 남겨보세요!</p>';
                return;
            }

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const date = data.createdAt ? data.createdAt.toDate().toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : "방금 전";
                const isOwner = currentUser && currentUser.uid === data.uid;

                const card = document.createElement('div');
                card.className = 'paper-card';
                card.innerHTML = `
                    <h3>${data.title}</h3>
                    <p>${data.content}</p>
                    <span class="time">${data.author} | ${date}</span>
                    ${isOwner ? `<div class="edit-btns">
                        <span class="edit-btn">✏️</span>
                        <span class="delete-btn">🗑️</span>
                    </div>` : ''}
                `;

                // 수정/삭제 이벤트 리스너 등록
                if (isOwner) {
                    card.querySelector('.edit-btn').onclick = () => openEditModal(doc.id, data.title, data.content);
                    card.querySelector('.delete-btn').onclick = () => deletePaper(doc.id);
                }
                
                container.appendChild(card);
            });
        } catch (e) {
            console.error("Error loading papers: ", e);
        }
    }

    // --- 인증 설정 ---
    onAuthStateChanged(auth, (user) => {
        currentUser = user;
        document.getElementById('authBtn').innerText = user ? "로그아웃" : "로그인";
        loadPapers(); // 유저 상태 바뀌면 권한 확인을 위해 다시 불러옴
    });

    document.getElementById('authBtn').onclick = () => {
        if (currentUser) signOut(auth);
        else signInWithPopup(auth, provider);
    };

    // --- 모달 제어 ---
    const modal = document.getElementById('writeModal');
    document.getElementById('openModalBtn').onclick = () => {
        editId = null;
        document.getElementById('modalTitle').innerText = "메시지 작성";
        document.getElementById('postTitle').value = '';
        document.getElementById('postContent').value = '';
        modal.style.display = 'block';
    };

    document.getElementById('closeModalBtn').onclick = () => modal.style.display = 'none';

    function openEditModal(id, title, content) {
        editId = id;
        document.getElementById('modalTitle').innerText = "메시지 수정";
        document.getElementById('postTitle').value = title;
        document.getElementById('postContent').value = content;
        modal.style.display = 'block';
    }

    // --- 데이터 저장/삭제 ---
    document.getElementById('confirmSaveBtn').onclick = async () => {
        const title = document.getElementById('postTitle').value.trim();
        const content = document.getElementById('postContent').value.trim();
        
        if (!title || !content) return alert("내용을 입력해주세요.");

        try {
            if (editId) {
                await updateDoc(doc(db, "papers", editId), { title, content });
            } else {
                await addDoc(collection(db, "papers"), {
                    title,
                    content,
                    uid: currentUser ? currentUser.uid : null,
                    author: currentUser ? currentUser.displayName : "게스트",
                    createdAt: serverTimestamp()
                });
            }
            modal.style.display = 'none';
            loadPapers(); // 작성 후 다시 읽기
        } catch (e) {
            alert("저장 중 오류가 발생했습니다.");
        }
    };

    async function deletePaper(id) {
        if (confirm("정말 삭제할까요?")) {
            await deleteDoc(doc(db, "papers", id));
            loadPapers(); // 삭제 후 다시 읽기
        }
    }
</script>

</body>
</html>
