<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종현이에게 보내는 메시지</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: #f0f2f5; margin: 0; padding-bottom: 80px; }
        header { background: #fff; padding: 20px; text-align: center; position: sticky; top: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 100; }
        .login-btn { position: absolute; right: 15px; top: 20px; padding: 5px 12px; border-radius: 20px; border: 1px solid #ddd; background: #fff; cursor: pointer; }
        
        #papers-container { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px; 
            padding: 15px; 
            max-width: 600px; 
            margin: auto; 
        }
        
        .paper-card { 
            background: #fff; 
            padding: 15px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            position: relative;
            word-break: break-all;
        }
        .paper-card h3 { margin: 0 0 8px 0; font-size: 1.1rem; }
        .paper-card p { margin: 0; font-size: 0.9rem; color: #444; }
        .paper-card .time { font-size: 0.7rem; color: #999; margin-top: 10px; display: block; }
        .edit-btns { position: absolute; top: 5px; right: 5px; font-size: 0.7rem; }

        .fab { 
            position: fixed; bottom: 25px; right: 25px; 
            width: 56px; height: 56px; background: #007bff; 
            border-radius: 50%; color: white; border: none; 
            font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer;
        }

        /* Modal Style */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; }
        .modal-content { background: white; width: 80%; max-width: 400px; margin: 100px auto; padding: 20px; border-radius: 15px; }
        input, textarea { width: 100%; margin-bottom: 10px; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>

<header>
    <button class="login-btn" id="authBtn">로그인</button>
    <h2 style="margin:0; font-size: 1.2rem;">종현이에게 하고 싶은 말을 적어주세요</h2>
</header>

<div id="papers-container">
    <!-- 메시지가 여기에 렌더링됩니다 -->
</div>

<button class="fab" onclick="openModal()">+</button>

<!-- 글쓰기 모달 -->
<div id="writeModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">메시지 남기기</h3>
        <input type="text" id="postTitle" placeholder="제목">
        <textarea id="postContent" rows="4" placeholder="내용을 입력하세요"></textarea>
        <button onclick="savePaper()" style="width:100%; padding:10px; background:#007bff; color:white; border:none; border-radius:5px;">확인</button>
        <button onclick="closeModal()" style="width:100%; margin-top:5px; background:none; border:none; color:#666;">취소</button>
    </div>
</div>

<script type="module">
    // --- Firebase Logic ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBr6fn0z5WiCb8r0ho9dRM_rcJFncEZfdg",
        authDomain: "click-396e8.firebaseapp.com",
        projectId: "click-396e8",
        storageBucket: "click-396e8.firebasestorage.app",
        messagingSenderId: "985576350437",
        appId: "1:985576350437:web:ed65dbfff76cbdf5c2ea0c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let editId = null;

    // 로그인/로그아웃 처리
    const authBtn = document.getElementById('authBtn');
    authBtn.onclick = () => {
        if (currentUser) {
            signOut(auth);
        } else {
            signInWithPopup(auth, provider);
        }
    };

    onAuthStateChanged(auth, (user) => {
        currentUser = user;
        authBtn.innerText = user ? "로그아웃" : "로그인";
    });

    // 데이터 불러오기 (실시간 리스너)
    const q = query(collection(db, "papers"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
        const container = document.getElementById('papers-container');
        container.innerHTML = '';
        snapshot.forEach((doc) => {
            const data = doc.data();
            const date = data.createdAt?.toDate().toLocaleString('ko-KR') || "방금 전";
            const isOwner = currentUser && currentUser.uid === data.uid;

            container.innerHTML += `
                <div class="paper-card">
                    ${isOwner ? `<div class="edit-btns">
                        <span onclick="editPaper('${doc.id}', '${data.title}', '${data.content}')">✏️</span>
                        <span onclick="deletePaper('${doc.id}')">🗑️</span>
                    </div>` : ''}
                    <h3>${data.title}</h3>
                    <p>${data.content}</p>
                    <span class="time">${data.author} | ${date}</span>
                </div>
            `;
        });
    });

    // 전역 함수 등록 (HTML에서 접근 가능하게)
    window.openModal = () => { 
        editId = null;
        document.getElementById('postTitle').value = '';
        document.getElementById('postContent').value = '';
        document.getElementById('writeModal').style.display = 'block'; 
    };
    window.closeModal = () => { document.getElementById('writeModal').style.display = 'none'; };

    window.savePaper = async () => {
        const title = document.getElementById('postTitle').value;
        const content = document.getElementById('postContent').value;
        if(!title || !content) return alert("내용을 채워주세요!");

        const paperData = {
            title,
            content,
            uid: currentUser ? currentUser.uid : null,
            author: currentUser ? currentUser.displayName : "게스트",
            createdAt: serverTimestamp()
        };

        if (editId) {
            await updateDoc(doc(db, "papers", editId), { title, content });
        } else {
            await addDoc(collection(db, "papers"), paperData);
        }
        closeModal();
    };

    window.editPaper = (id, title, content) => {
        editId = id;
        document.getElementById('postTitle').value = title;
        document.getElementById('postContent').value = content;
        document.getElementById('writeModal').style.display = 'block';
    };

    window.deletePaper = async (id) => {
        if(confirm("정말 삭제하시겠습니까?")) {
            await deleteDoc(doc(db, "papers", id));
        }
    };
</script>
</body>
</html>
